components:
  schemas:
    GithubWorkflowRunCompletedFilters:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: string
          description: Only trigger if the workflow run is in one of the repositories
        workflowNames:
          type: array
          items:
            type: string
          description: Only trigger for specific workflow names
        branches:
          type: array
          items:
            type: string
          description: Only trigger for specific branches
        conclusions:
          type: array
          items:
            type: string
            enum:
            - success
            - failure
            - neutral
            - cancelled
            - timed_out
            - action_required
            - stale
            - skipped
          description: Only trigger for these completed workflow results, such as success
        events:
          type: array
          items:
            type: string
            minLength: 1
          description: Only trigger for these originating GitHub events; use schedule for cron runs, not push or pull_request
    LinearIssueLabelAddedFilters:
      type: object
      properties:
        teams:
          type: array
          items:
            type: string
          description: Only trigger if the issue belongs to one of the specified teams
        assignedTo:
          type: array
          items:
            type: string
          description: Only trigger if the issue is assigned to one of the specified users
        labels:
          type: array
          items:
            type: string
          description: Only trigger if one of the specified labels was added to the issue
    GithubTemboPullRequestOpenedFilters:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: string
          description: Only trigger if the pull request is in one of the repositories
        draftPrs:
          type: boolean
          description: Also trigger for draft pull requests
    SentryIssueCreatedFilters:
      type: object
