                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          enum:
          - addTestCoverage
          - addTestCoverageFromJira
          - autoAgentsMdMaintainer
          - autoDocsMaintainer
          - commitOfTheDay
          - customerHealthMonitoringAgent
          - deadCodeCleanup
          - dependencySweepAgent
          - autoFixCi
          - autoFixSentryError
          - dailySlackChangelog
          - duplicateTicketDetector
