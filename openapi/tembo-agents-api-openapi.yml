openapi: 3.2.0
info:
  title: Tembo Agents API
  version: 1.0.0
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Agents
paths:
  /v1/agents:
    get:
      operationId: listAgents
      summary: List agents
      description: List agents available in your organization, with optional search, status, integration, and author filters.
      tags:
      - Agents
      security:
      - apiKey: []
      responses:
        '200':
          description: List agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        organizationId:
                          type:
                          - string
                          - 'null'
                          minLength: 1
                          maxLength: 255
                        organizationName:
                          type:
                          - string
                          - 'null'
                        createdBy:
                          type:
                          - string
                          - 'null'
                        name:
                          type: string
                        instructions:
                          oneOf:
                          - $ref: '#/components/schemas/TipTapDocument'
                            description: Instructions for the agent as a rich-text document. Mentions can reference integrations used by the agent.
                          - type: 'null'
                        agent:
                          type:
                          - string
                          - 'null'
                          description: Runtime and model selection key; not the ID of an agent resource.
                        mcpServers:
                          type: array
                          items:
                            type: string
                            minLength: 1
                            maxLength: 200
                          maxItems: 100
                          description: Selected MCP server identifiers, including built-in server keys.
                        artifactType:
                          type:
                          - string
                          - 'null'
                          enum:
                          - PullRequest
                          - ToolCall
                          - Plan
                          - Response
                          - File
                          - Service
                          - Source
                          - null
                        createdAt:
                          type: string
                          format: date-time
                        archivedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        enabledAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        lastRun:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                              format: uuid
                            sessionId:
                              type:
                              - string
                              - 'null'
                            status:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                            durationMs:
                              type: integer
                              description: Measured duration of the agent run in milliseconds.
                            errorMessage:
                              type:
                              - string
                              - 'null'
                          required:
                          - id
                          - sessionId
                          - status
                          - createdAt
                          - updatedAt
                          - durationMs
                          - errorMessage
                          additionalProperties: false
                        runCount:
                          type: integer
                          minimum: 0
                        scheduleCount:
                          type: integer
                          minimum: 0
                        triggerCount:
                          type: integer
                          minimum: 0
                        hasPausedSchedule:
                          type: boolean
                        hasPausedTrigger:
                          type: boolean
                        integrationIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                        integrationTypes:
                          type: array
                          items:
                            type: string
                        codeRepositoryCount:
                          type: integer
                          minimum: 0
                      required:
                      - id
                      - organizationId
                      - organizationName
                      - createdBy
                      - name
                      - instructions
                      - agent
                      - mcpServers
                      - artifactType
                      - createdAt
                      - archivedAt
                      - enabledAt
                      - lastRun
                      - runCount
                      - scheduleCount
                      - triggerCount
                      - hasPausedSchedule
                      - hasPausedTrigger
                      - integrationIds
                      - integrationTypes
                      - codeRepositoryCount
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  filterOptions:
                    type: object
                    properties:
                      totalCount:
                        type: integer
                        minimum: 0
                      integrationTypes:
                        type: array
                        items:
                          type: string
                    required:
                    - totalCount
                    - integrationTypes
                    additionalProperties: false
                required:
                - items
                - nextCursor
                - filterOptions
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Resource conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Agent operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 2000
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: ids
        schema:
          type: string
          maxLength: 10000
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: archived
        schema:
          type: boolean
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - latestRun
          - runCount
      - in: query
        name: status
        schema:
          type: string
          maxLength: 10000
      - in: query
        name: integration
        schema:
          type: string
          maxLength: 10000
      - in: query
        name: author
        schema:
          type: string
          maxLength: 10000
    post:
      operationId: createAgent
      summary: Create an agent
      description: Create an agent from instructions, a template, or another agent. sourceAgentId cannot be combined with other fields. Template creation accepts only templateName, name, and triggers; creation from scratch requires name.
      tags:
      - Agents
      security:
      - apiKey: []
      responses:
        '201':
          description: Create an agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  key:
                    type:
                    - string
                    - 'null'
                  sandboxSize:
                    type:
                    - string
                    - 'null'
                    enum:
                    - nano
                    - micro
                    - small
                    - medium
                    - large
                    - xl
                    - xxl
                    - ultra
                    - null
                  projectId:
                    type:
                    - string
                    - 'null'
                  templateId:
                    type:
                    - string
                    - 'null'
                  contentVersion:
                    type: integer
                    default: 1
                  script:
                    type:
                    - string
                    - 'null'
                  artifactType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - PullRequest
                    - ToolCall
                    - Plan
                    - Response
                    - File
                    - Service
                    - Source
                    - null
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  archivedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  enabledAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  organizationId:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    maxLength: 255
                  organizationName:
                    type:
                    - string
                    - 'null'
                  createdBy:
                    type:
                    - string
                    - 'null'
                  instructions:
                    oneOf:
                    - $ref: '#/components/schemas/TipTapDocument'
                      description: Instructions for the agent as a rich-text document. Mentions can reference integrations used by the agent.
                    - type: 'null'
                  agent:
                    type:
                    - string
                    - 'null'
                    description: Runtime and model selection key; not the ID of an agent resource.
                  agentOptions:
                    $ref: '#/components/schemas/AgentOptionsInput'
                  mcpServers:
                    type: array
                    items:
                      type: string
                      minLength: 1
                      maxLength: 200
                    maxItems: 100
                    description: Selected MCP server identifiers, including built-in server keys.
                  userState:
                    oneOf:
                    - $ref: '#/components/schemas/AgentState'
                    - type: 'null'
                  codeRepositories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        owner:
                          type:
                          - string
                          - 'null'
                        integrationId:
                          type: string
                          format: uuid
                        integrationType:
                          type: string
                      required:
                      - id
                      - name
                      - owner
                      - integrationId
                      - integrationType
                      additionalProperties: false
                    maxItems: 250
                  lastRun:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: string
                        format: uuid
                      sessionId:
                        type:
                        - string
                        - 'null'
                      status:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      durationMs:
                        type: integer
                        description: Measured duration of the agent run in milliseconds.
                      errorMessage:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - sessionId
                    - status
                    - createdAt
                    - updatedAt
                    - durationMs
                    - errorMessage
                    additionalProperties: false
                  runCount:
                    type: integer
                    minimum: 0
                  scheduleCount:
                    type: integer
                    minimum: 0
                  triggerCount:
                    type: integer
                    minimum: 0
                  hasPausedSchedule:
                    type: boolean
                  hasPausedTrigger:
                    type: boolean
                  integrationIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  integrationTypes:
                    type: array
                    items:
                      type: string
                required:
                - id
                - name
                - key
                - sandboxSize
                - projectId
                - templateId
                - contentVersion
                - script
                - artifactType
                - createdAt
                - updatedAt
                - archivedAt
                - enabledAt
                - organizationId
                - organizationName
                - createdBy
                - instructions
                - agent
                - agentOptions
                - mcpServers
                - userState
                - codeRepositories
                - lastRun
                - runCount
                - scheduleCount
                - triggerCount
                - hasPausedSchedule
                - hasPausedTrigger
                - integrationIds
                - integrationTypes
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Resource conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Agent operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                instructions:
                  $ref: '#/components/schemas/TipTapDocument'
                  description: Instructions for the agent as a rich-text document. Mentions can reference integrations used by the agent.
                mcpServers:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                  maxItems: 100
                agent:
                  type: string
                  minLength: 1
                  maxLength: 200
                agentOptions:
                  $ref: '#/components/schemas/AgentOptionsInput'
                sandboxSize:
                  type:
                  - string
                  - 'null'
                  enum:
                  - nano
                  - micro
                  - small
                  - medium
                  - large
                  - xl
                  - xxl
                  - ultra
                  - null
                projectId:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: string
                    const: tembo
                  - type: 'null'
                artifactType:
                  type:
                  - string
                  - 'null'
                  enum:
                  - PullRequest
                  - ToolCall
                  - Plan
                  - Response
                  - File
                  - Service
                  - Source
                  - null
                repositoryIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 250
                triggers:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 200
                      integrationType:
                        type: string
                        minLength: 1
                        maxLength: 100
                      integrationId:
                        type: string
                        format: uuid
                      filters:
                        $ref: '#/components/schemas/TriggerFilters'
                    required:
                    - name
                    additionalProperties: false
                  maxItems: 50
                schedules:
                  type: array
                  items:
                    type: object
                    properties:
                      cron:
                        type: string
                        minLength: 1
                        maxLength: 500
                    required:
                    - cron
                    additionalProperties: false
                  maxItems: 50
                templateName:
                  type: string
                  enum:
                  - addTestCoverage
                  - addTestCoverageFromJira
                  - autoAgentsMdMaintainer
                  - autoDocsMaintainer
                  - commitOfTheDay
                  - customerHealthMonitoringAgent
                  - deadCodeCleanup
                  - dependencySweepAgent
                  - autoFixCi
                  - autoFixSentryError
                  - dailySlackChangelog
                  - duplicateTicketDetector
                  - fixBugsReportedInSlack
                  - enrichGithubIssue
                  - enrichJiraIssue
                  - enrichLinearIssue
                  - hubspotCallTaskCoach
                  - hubspotEmailTaskDrafter
                  - hubspotTicketToLinearBug
                  - prDescription
                  - prReview
                  - pagePerformanceReport
                  - prioritizeSentry
                  - productFaqAgent
                  - productFinanceAgent
                  - queryPerformanceReport
                  - securityFixFromJira
                  - securityScan
                  - skillProgressionMap
                  - slackChannelListener
                  - slopCop
                  - testAudit
                  - staleCodeComments
                  - stalePullRequestNotifier
                  - summarizeChangesDaily
                  - triageNewJiraBug
                sourceAgentId:
                  type: string
                  format: uuid
              additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/agents/templates:
    get:
      operationId: listAgentTemplates
      summary: List agent templates
      description: List reusable agent templates and their configuration requirements.
      tags:
      - Agents
      security:
      - apiKey: []
      responses:
        '200':
          description: List agent templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          enum:
                          - addTestCoverage
                          - addTestCoverageFromJira
                          - autoAgentsMdMaintainer
                          - autoDocsMaintainer
                          - commitOfTheDay
                          - customerHealthMonitoringAgent
                          - deadCodeCleanup
                          - dependencySweepAgent
                          - autoFixCi
                          - autoFixSentryError
                          - dailySlackChangelog
                          - duplicateTicketDetector
                          - fixBugsReportedInSlack
                          - enrichGithubIssue
                          - enrichJiraIssue
                          - enrichLinearIssue
                          - hubspotCallTaskCoach
                          - hubspotEmailTaskDrafter
                          - hubspotTicketToLinearBug
                          - prDescription
                          - prReview
                          - pagePerformanceReport
                          - prioritizeSentry
                          - productFaqAgent
                          - productFinanceAgent
                          - queryPerformanceReport
                          - securityFixFromJira
                          - securityScan
                          - skillProgressionMap
                          - slackChannelListener
                          - slopCop
                          - testAudit
                          - staleCodeComments
                          - stalePullRequestNotifier
                          - summarizeChangesDaily
                          - triageNewJiraBug
                        title:
                          type: string
                        description:
                          type: string
                        label:
                          type: string
                          enum:
                          - Code Review
                          - Productivity
                          - Documentation
                          - Reporting
                          - Monitoring
                          - Management
                        instructions:
                          $ref: '#/components/schemas/TipTapDocument'
                          description: Instructions for the agent as a rich-text document. Mentions can reference integrations used by the agent.
                        connectedApps:
                          type: array
                          items:
                            type: string
                        artifactType:
                          type:
                          - string
                          - 'null'
                          enum:
                          - PullRequest
                          - ToolCall
                          - Plan
                          - Response
                          - File
                          - Service
                          - Source
                          - null
                        agent:
                          type: string
                        triggers:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              displayName:
                                type: string
                              integrationType:
                                type: string
                              filters:
                                $ref: '#/components/schemas/TriggerFilters'
                            required:
                            - name
                            - displayName
                            - integrationType
                            additionalProperties: false
                        schedules:
                          type: array
                          items:
                            type: string
                        requiredParams:
                          type: array
                          items:
                            type: string
                            const: repository
                      required:
                      - name
                      - title
                      - description
                      - label
                      - instructions
                      - connectedApps
                      - agent
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    enum:
                    - addTestCoverage
                    - addTestCoverageFromJira
                    - autoAgentsMdMaintainer
                    - autoDocsMaintainer
                    - commitOfTheDay
                    - customerHealthMonitoringAgent
                    - deadCodeCleanup
                    - dependencySweepAgent
                    - autoFixCi
                    - autoFixSentryError
                    - dailySlackChangelog
                    - duplicateTicketDetector
                    - fixBugsReportedInSlack
                    - enrichGithubIssue
                    - enrichJiraIssue
                    - enrichLinearIssue
                    - hubspotCallTaskCoach
                    - hubspotEmailTaskDrafter
                    - hubspotTicketToLinearBug
                    - prDescription
                    - prReview
                    - pagePerformanceReport
                    - prioritizeSentry
                    - productFaqAgent
                    - productFinanceAgent
                    - queryPerformanceReport
                    - securityFixFromJira
                    - securityScan
                    - skillProgressionMap
                    - slackChannelListener
                    - slopCop
                    - testAudit
                    - staleCodeComments
                    - stalePullRequestNotifier
                    - summarizeChangesDaily
                    - triageNewJiraBug
                    - null
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Resource conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Agent operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
