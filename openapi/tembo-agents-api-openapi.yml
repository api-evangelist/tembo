    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/agents/templates/{templateName}:
    get:
      operationId: retrieveAgentTemplate
      summary: Retrieve an agent template
      description: Retrieve a reusable agent template by name, including its instructions and required parameters.
      tags:
      - Agents
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve an agent template
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    enum:
                    - addTestCoverage
                    - addTestCoverageFromJira
                    - autoAgentsMdMaintainer
                    - autoDocsMaintainer
                    - commitOfTheDay
                    - customerHealthMonitoringAgent
                    - deadCodeCleanup
                    - dependencySweepAgent
                    - autoFixCi
                    - autoFixSentryError
                    - dailySlackChangelog
                    - duplicateTicketDetector
                    - fixBugsReportedInSlack
                    - enrichGithubIssue
                    - enrichJiraIssue
                    - enrichLinearIssue
                    - hubspotCallTaskCoach
                    - hubspotEmailTaskDrafter
                    - hubspotTicketToLinearBug
                    - prDescription
                    - prReview
                    - pagePerformanceReport
                    - prioritizeSentry
                    - productFaqAgent
                    - productFinanceAgent
                    - queryPerformanceReport
                    - securityFixFromJira
                    - securityScan
                    - skillProgressionMap
                    - slackChannelListener
                    - slopCop
                    - testAudit
                    - staleCodeComments
                    - stalePullRequestNotifier
                    - summarizeChangesDaily
                    - triageNewJiraBug
                  title:
                    type: string
                  description:
                    type: string
                  label:
                    type: string
                    enum:
                    - Code Review
                    - Productivity
                    - Documentation
                    - Reporting
                    - Monitoring
                    - Management
                  instructions:
                    $ref: '#/components/schemas/TipTapDocument'
                    description: Instructions for the agent as a rich-text document. Mentions can reference integrations used by the agent.
                  connectedApps:
                    type: array
                    items:
                      type: string
                  artifactType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - PullRequest
                    - ToolCall
                    - Plan
                    - Response
                    - File
                    - Service
                    - Source
                    - null
                  agent:
                    type: string
                  triggers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        integrationType:
                          type: string
                        filters:
                          $ref: '#/components/schemas/TriggerFilters'
                      required:
                      - name
                      - displayName
                      - integrationType
                      additionalProperties: false
                  schedules:
                    type: array
                    items:
                      type: string
                  requiredParams:
                    type: array
                    items:
                      type: string
                      const: repository
                required:
                - name
                - title
                - description
                - label
                - instructions
                - connectedApps
                - agent
                additionalProperties: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Resource conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Agent operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: templateName
        schema:
