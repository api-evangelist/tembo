openapi: 3.2.0
info:
  title: Tembo Authentication API
  version: 1.0.0
  description: 'Operations tagged Authentication across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Authentication
paths:
  /auth/context:
    get:
      operationId: retrieveMcpAuthContext
      summary: Get the authenticated principal
      description: Returns the user or service identity and organization associated with the supplied OAuth access token, API key, or agent credential. Agent requests must specify the organization in the X-Agent-Org-Id header.
      tags:
      - Authentication
      responses:
        '200':
          description: The authenticated principal and organization. OAuth responses also include the client, granted scopes, and token expiration.
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    userId:
                      type: string
                    organizationId:
                      type: string
                    clientId:
                      type: string
                    scopes:
                      type: array
                      items:
                        type: string
                    expiresAt:
                      type: number
                  required:
                  - userId
                  - organizationId
                  - clientId
                  - scopes
                  - expiresAt
                - type: object
                  properties:
                    userId:
                      type: string
                    organizationId:
                      type: string
                  required:
                  - userId
                  - organizationId
                - type: object
                  properties:
                    principal:
                      type: string
                      const: agent
                    organizationId:
                      type: string
                  required:
                  - principal
                  - organizationId
        '401':
          description: The credential is missing or invalid.
        '403':
          description: The credential does not grant access to the requested organization.
        '503':
          description: The authentication provider is unavailable.
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
x-refined-from:
- tembo-openapi-original.json
- tembo-openapi.yml
x-provenance:
  method: harvested
  publisher: Tembo
  source: https://www.tembo.io/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
