                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: jobId
        schema:
          type: string
          minLength: 1
      - in: query
        name: sessionId
        schema:
          type: string
          format: uuid
      - in: query
        name: types
        schema:
          type: array
          items:
            type: string
            enum:
            - PullRequest
            - ToolCall
            - Plan
            - Response
            - File
            - Service
            - Source
            default: PullRequest
          minItems: 1
