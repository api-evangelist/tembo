openapi: 3.2.0
info:
  title: Tembo Artifacts API
  version: 1.0.0
  description: 'Operations tagged Artifacts across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Artifacts
paths:
  /v1/artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts
      description: List organization artifacts with optional session and type filters.
      tags:
      - Artifacts
      security:
      - apiKey: []
      responses:
        '200':
          description: List artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt:
                          type: string
                          format: date-time
                        id:
                          type: string
                          format: uuid
                        sessionId:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                          - PullRequest
                          - ToolCall
                          - Plan
                          - Response
                          - File
                          - Service
                          - Source
                          default: PullRequest
                        updatedAt:
                          type: string
                          format: date-time
                        assetId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        category:
                          type:
                          - string
                          - 'null'
                          enum:
                          - code_walkthrough
                          - bug_report
                          - incident_report
                          - license_audit
                          - data_flow_map
                          - security_findings
                          - cost_map
                          - ux_variations
                          - architecture_map
                          - migration_summary
                          - release_checklist
                          - shipped_summary
                          - rollout_plan
                          - diagram
                          - chart
                          - dashboard
                          - timeline
                          - comparison
                          - report
                          - null
                        contentType:
                          type:
                          - string
                          - 'null'
                        description:
                          type:
                          - string
                          - 'null'
                        fileKind:
                          type: string
                          enum:
                          - image
                          - video
                          - audio
                          - html
                          - markdown
                          - text
                          - file
                        fileName:
                          type:
                          - string
                          - 'null'
                        outputType:
                          type:
                          - string
                          - 'null'
                          enum:
                          - html
                          - markdown
                          - json
                          - csv
                          - asset
                          - null
                        relatedPullRequestUrls:
                          type: array
                          items:
                            type: string
                            format: uri
                        runtime:
                          type:
                          - object
                          - 'null'
                          properties:
                            hostname:
                              type:
                              - string
                              - 'null'
                            serviceName:
                              type:
                              - string
                              - 'null'
                            serviceType:
                              type:
                              - string
                              - 'null'
                          required:
                          - hostname
                          - serviceName
                          - serviceType
                          additionalProperties: false
                        servicePort:
                          type:
                          - integer
                          - 'null'
                          minimum: 1
                          maximum: 65535
                        serviceUrl:
                          type:
                          - string
                          - 'null'
                          format: uri
                        sizeBytes:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                        sourceUrl:
                          type:
                          - string
                          - 'null'
                          format: uri
                        title:
                          type: string
                      required:
                      - createdAt
                      - id
                      - sessionId
                      - type
                      - updatedAt
                      - assetId
                      - category
                      - contentType
                      - description
                      - fileKind
                      - fileName
                      - outputType
                      - relatedPullRequestUrls
                      - runtime
                      - servicePort
                      - serviceUrl
                      - sizeBytes
                      - sourceUrl
                      - title
                      additionalProperties: false
