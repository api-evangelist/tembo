                additionalProperties: false
        '500':
          description: Artifact operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Human-readable title for the artifact.
                description:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Short description of what the artifact shows.
                category:
                  type: string
                  enum:
                  - code_walkthrough
                  - bug_report
                  - incident_report
                  - license_audit
                  - data_flow_map
                  - security_findings
                  - cost_map
                  - ux_variations
                  - architecture_map
                  - migration_summary
                  - release_checklist
                  - shipped_summary
                  - rollout_plan
                  - diagram
                  - chart
                  - dashboard
                  - timeline
                  - comparison
                  - report
                  description: Artifact category for display and filtering.
                output:
                  oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        const: html
                      content:
                        type: string
                        minLength: 1
                        description: Complete self-contained HTML document. Inline CSS and JavaScript are allowed. Do not depend on external network assets. Must be at most 5242880 bytes after UTF-8 encoding.
                      fileName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Optional stored filename. The extension is normalized.
                    required:
                    - type
                    - content
                    additionalProperties: false
                    description: Complete self-contained HTML document. Inline CSS and JavaScript are allowed. Do not depend on external network assets.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: markdown
                      content:
                        type: string
                        minLength: 1
                        description: Markdown content for a readable report, checklist, walkthrough, or notes artifact. Must be at most 5242880 bytes after UTF-8 encoding.
                      fileName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Optional stored filename. The extension is normalized.
                    required:
                    - type
                    - content
                    additionalProperties: false
                    description: Markdown content for a readable report, checklist, walkthrough, or notes artifact.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: json
                      content:
                        type: string
                        minLength: 1
                        description: JSON text for structured data, diagnostics, or machine-readable findings. Send the JSON as a string, not as an object. Must be at most 5242880 bytes after UTF-8 encoding.
                      fileName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Optional stored filename. The extension is normalized.
                    required:
                    - type
                    - content
                    additionalProperties: false
                    description: JSON text for structured data, diagnostics, or machine-readable findings. Send the JSON as a string, not as an object.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: csv
                      content:
                        type: string
                        minLength: 1
                        description: CSV content for audits, tables, inventories, reports, and spreadsheet-friendly exports. Must be at most 5242880 bytes after UTF-8 encoding.
                      fileName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Optional stored filename. The extension is normalized.
                    required:
                    - type
                    - content
                    additionalProperties: false
                    description: CSV content for audits, tables, inventories, reports, and spreadsheet-friendly exports.
                  - type: object
                    properties:
                      type:
                        type: string
                        const: asset
                      assetId:
                        type: string
                        format: uuid
                        description: ID of an existing uploaded Tembo asset.
                      fileName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Optional display filename for the uploaded asset.
                    required:
                    - type
                    - assetId
                    additionalProperties: false
                    description: Attach title, category, and artifact metadata to an already uploaded screenshot, image, video, audio file, PDF, or other binary asset.
                  description: Artifact content or a reference to an uploaded asset. The type field selects the required fields.
                relatedPullRequestUrls:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 20
                  description: URLs of pull requests related to this artifact.
                sessionId:
                  type: string
                  format: uuid
              required:
              - title
              - output
              - sessionId
              additionalProperties: false
    servers:
    - url: https://api.tembo.io/
