                    - serviceName
                    - serviceType
                    additionalProperties: false
                  servicePort:
                    type:
                    - integer
                    - 'null'
                    minimum: 1
                    maximum: 65535
                  serviceUrl:
                    type:
                    - string
                    - 'null'
                    format: uri
                  sizeBytes:
                    type:
                    - integer
                    - 'null'
                    minimum: 0
                  sourceUrl:
                    type:
                    - string
                    - 'null'
                    format: uri
                  title:
                    type: string
                required:
                - createdAt
                - id
                - sessionId
                - type
                - updatedAt
                - assetId
                - assetUrl
                - category
                - content
                - contentType
                - description
                - fileKind
                - fileName
                - outputType
                - relatedPullRequestUrls
                - runtime
                - servicePort
                - serviceUrl
                - sizeBytes
                - sourceUrl
                - title
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Artifact, session, or backing asset not found
