            application/json:
              schema:
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                  id:
                    type: string
                    format: uuid
                  sessionId:
                    type: string
                    format: uuid
                  type:
                    type: string
                    enum:
                    - PullRequest
                    - ToolCall
                    - Plan
                    - Response
                    - File
                    - Service
                    - Source
                    default: PullRequest
                  updatedAt:
                    type: string
                    format: date-time
                  assetId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  assetUrl:
                    type:
                    - string
                    - 'null'
                    format: uri
                  category:
                    type:
                    - string
                    - 'null'
                    enum:
                    - code_walkthrough
                    - bug_report
                    - incident_report
                    - license_audit
                    - data_flow_map
                    - security_findings
                    - cost_map
                    - ux_variations
                    - architecture_map
                    - migration_summary
                    - release_checklist
                    - shipped_summary
                    - rollout_plan
                    - diagram
                    - chart
                    - dashboard
                    - timeline
                    - comparison
                    - report
                    - null
                  content:
                    type: string
                  contentType:
                    type:
                    - string
                    - 'null'
                  description:
                    type:
                    - string
                    - 'null'
                  fileKind:
                    type: string
                    enum:
                    - image
                    - video
                    - audio
                    - html
                    - markdown
                    - text
                    - file
                  fileName:
                    type:
                    - string
                    - 'null'
                  outputType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - html
                    - markdown
                    - json
                    - csv
                    - asset
                    - null
                  relatedPullRequestUrls:
