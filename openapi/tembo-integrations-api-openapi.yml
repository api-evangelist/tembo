openapi: 3.2.0
info:
  title: Tembo Integrations API
  version: 1.0.0
  description: 'Operations tagged Integrations across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Integrations
paths:
  /v1/integrations:
    get:
      operationId: listIntegrations
      summary: List integrations
      description: List integrations visible to the current organization or authenticated admin.
      tags:
      - Integrations
      security:
      - apiKey: []
      responses:
        '200':
          description: List integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt:
                          type: string
                          format: date-time
                        displayName:
                          type: string
                        enabledAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        id:
                          type: string
                        lastSyncedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        repositoryCount:
                          type: integer
                          minimum: 0
                        sourceCount:
                          type: integer
                          minimum: 0
                        type:
                          type: string
                          minLength: 1
                          maxLength: 100
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - createdAt
                      - displayName
                      - enabledAt
                      - id
                      - lastSyncedAt
                      - repositoryCount
                      - sourceCount
                      - type
                      - updatedAt
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  totalCount:
                    type: integer
                    minimum: 0
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing organization information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Provider authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller cannot perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Integration conflict or unsupported operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Integration operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Integration provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '504':
          description: Integration provider operation timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: enabled
        schema:
          type: boolean
      - in: query
        name: hasEnabledRepositories
        schema:
          type: boolean
      - in: query
        name: ids
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          minItems: 1
          maxItems: 18
      - in: query
        name: createdAfter
        schema:
          type: string
          format: date-time
      - in: query
        name: excludeOrganizationName
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: includeTotal
        schema:
          type: boolean
          default: false
    post:
      operationId: createIntegration
      summary: Create an integration
      description: Create an integration that does not require an OAuth callback.
      tags:
      - Integrations
      security:
      - apiKey: []
      responses:
        '201':
          description: Create an integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration:
                    type: object
                    properties:
                      createdAt:
                        type: string
                        format: date-time
                      displayName:
                        type: string
                      enabledAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      id:
                        type: string
                      lastSyncedAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      repositoryCount:
                        type: integer
                        minimum: 0
                      sourceCount:
                        type: integer
                        minimum: 0
                      type:
                        type: string
                        minLength: 1
                        maxLength: 100
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                    - createdAt
                    - displayName
                    - enabledAt
                    - id
                    - lastSyncedAt
                    - repositoryCount
                    - sourceCount
                    - type
                    - updatedAt
                    additionalProperties: false
                  sessionSourceId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                required:
                - integration
                - sessionSourceId
                additionalProperties: false
        '400':
          description: Invalid request or missing organization information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Provider authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller cannot perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Integration conflict or unsupported operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Integration operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Integration provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '504':
          description: Integration provider operation timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  environment:
                    type: string
                    minLength: 1
                    maxLength: 200
                  roleArn:
                    type: string
                    minLength: 1
                    maxLength: 2048
                  type:
                    type: string
                    const: aws
                required:
                - environment
                - roleArn
                - type
                additionalProperties: false
              - type: object
                properties:
                  projectId:
                    type: string
                    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
                  serviceAccountJson:
                    type: string
                    minLength: 1
                    maxLength: 1000000
                  type:
                    type: string
                    const: bigquery
                required:
                - projectId
                - serviceAccountJson
                - type
                additionalProperties: false
              - type: object
                properties:
                  accessToken:
                    type: string
                    minLength: 1
                    maxLength: 65536
                  type:
                    type: string
                    const: gitlab
                required:
                - accessToken
                - type
                additionalProperties: false
              - type: object
                properties:
                  gateway:
                    type: string
                    minLength: 1
                    maxLength: 2048
                  instanceName:
                    type: string
                    minLength: 1
                    maxLength: 200
                  password:
                    type: string
                    minLength: 1
                    maxLength: 65536
                  protocol:
                    type: string
                    enum:
                    - fortinet
                    - anyconnect
                    - gp
                    - nc
                  type:
                    type: string
                    const: openconnect
                  username:
                    type: string
                    minLength: 1
                    maxLength: 4096
                required:
                - gateway
                - instanceName
                - password
                - protocol
                - type
                - username
                additionalProperties: false
              - type: object
                properties:
                  caCertificate:
                    type: string
                    maxLength: 1000000
                  connectionString:
                    type: string
                    minLength: 1
                    maxLength: 16384
                  instanceName:
                    type: string
                    minLength: 1
                    maxLength: 200
                  type:
                    type: string
                    const: postgres
                required:
                - connectionString
                - instanceName
                - type
                additionalProperties: false
              - type: object
                properties:
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 16384
                  clientSecret:
                    type: string
                    minLength: 1
                    maxLength: 65536
                  organizationId:
                    type: string
                    format: uuid
                  organizationName:
                    type: string
                    minLength: 1
                    maxLength: 500
                  type:
                    type: string
                    const: snyk
                required:
                - clientId
                - clientSecret
                - organizationId
                - type
                additionalProperties: false
              - type: object
                properties:
                  instanceName:
                    type: string
                    minLength: 1
                    maxLength: 200
                  oauthClientId:
                    type: string
                    minLength: 1
                    maxLength: 16384
                  oauthClientSecret:
                    type: string
                    minLength: 1
                    maxLength: 65536
                  tags:
                    type: array
                    items:
                      type: string
                      pattern: ^tag:[a-z0-9][a-z0-9-]*$
                    minItems: 1
                    maxItems: 100
                  tailnet:
                    type: string
                    minLength: 1
                    maxLength: 500
                    default: '-'
                  type:
                    type: string
                    const: tailscale
                required:
                - instanceName
                - oauthClientId
                - oauthClientSecret
                - tags
                - type
                additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/integrations/sync:
    post:
      operationId: syncIntegrations
      summary: Sync eligible integrations
      description: Queue integration and pull-request sync jobs for integrations with enabled repositories.
      tags:
      - Integrations
      security:
      - apiKey: []
      responses:
        '200':
          description: Sync eligible integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligibleIntegrationCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  integrationSyncJobCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  pullRequestSyncJobCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - eligibleIntegrationCount
                - integrationSyncJobCount
                - pullRequestSyncJobCount
                additionalProperties: false
        '400':
          description: Invalid request or missing organization information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Provider authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller cannot perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Integration conflict or unsupported operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Integration operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Integration provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '504':
          description: Integration provider operation timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/integrations/sync/status:
    get:
      operationId: retrieveIntegrationSyncStatus
      summary: Retrieve eligible integration sync status
      description: Count active sync jobs for integrations with enabled repositories.
      tags:
      - Integrations
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve eligible integration sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeJobCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  eligibleIntegrationCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                - activeJobCount
                - eligibleIntegrationCount
                additionalProperties: false
        '400':
          description: Invalid request or missing organization information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Provider authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller cannot perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Integration conflict or unsupported operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Integration operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Integration provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '504':
          description: Integration provider operation timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/integrations/providers:
    get:
      operationId: listIntegrationProviders
      summary: List integration providers
      description: List providers available to the current organization.
      tags:
      - Integrations
      security:
      - apiKey: []
      responses:
        '200':
          description: List integration providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  installedCounts:
                    type: object
                    properties:
                      github:
                        type: integer
                        minimum: 0
                      gitlab:
                        type: integer
                        minimum: 0
                      bitbucket:
                        type: integer
                        minimum: 0
                      atlassian:
                        type: integer
                        minimum: 0
                      linear:
                        type: integer
                        minimum: 0
                      slack:
                        type: integer
                        minimum: 0
                      sentry:
                        type: integer
                        minimum: 0
                      aws:
                        type: integer
                        minimum: 0
                      agent:
                        type: integer
                        minimum: 0
                      notion:
                        type: integer
                        minimum: 0
                      postgres:
                        type: integer
                        minimum: 0
                      bigquery:
                        type: integer
                        minimum: 0
                      azure:
                        type: integer
                        minimum: 0
                      ms-teams:
                        type: integer
                        minimum: 0
                      snyk:
                        type: integer
                        minimum: 0
                      hubspot:
                        type: integer
                        minimum: 0
                      openconnect:
                        type: integer
                        minimum: 0
                      tailscale:
                        type: integer
                        minimum: 0
                    additionalProperties: false
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        authorizeUrl:
                          type: string
                          maxLength: 8192
                        category:
                          type: string
                          maxLength: 200
                        comingSoon:
                          type: boolean
                        description:
                          type: string
                          maxLength: 4096
                        displayName:
                          type: string
                          maxLength: 500
                        installed:
                          type: boolean
                        integrationType:
                          type: string
                          enum:
                          - github
                          - gitlab
                          - bitbucket
                          - atlassian
                          - linear
                          - slack
                          - sentry
                          - aws
                          - agent
                          - notion
                          - postgres
                          - bigquery
                          - azure
                          - ms-teams
                          - snyk
                          - hubspot
                          - openconnect
                          - tailscale
                        isOAuth:
                          type: boolean
                        name:
                          type: string
                          maxLength: 500
                        oidcIssuerHost:
                          type: string
                          maxLength: 2048
                        redirectUrl:
                          type: string
                          maxLength: 8192
                        templateUrl:
                          type: string
                          maxLength: 8192
                      required:
                      - authorizeUrl
                      - category
                      - comingSoon
                      - description
                      - displayName
                      - installed
                      - integrationType
                      - isOAuth
                      - name
                      additionalProperties: false
                    maxItems: 100
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    pattern: ^\d+$
                    maxLength: 10
                required:
                - installedCounts
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing organization information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Provider authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller cannot perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Integration not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Integration conflict or unsupported operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Integration operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Integration provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '504':
          description: Integration provider operation timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          pattern: ^\d+$
          maxLength: 10
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: returnUrl
        schema:
          type: string
          format: uri
          maxLength: 8192
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/integrations/triggers:
    get:
      operationId: listIntegrationTriggers
      summary: List integration triggers
      description: List visible automation triggers grouped by provider.
      tags:
      - Integrations
      security:
      - apiKey: []
      responses:
        '200':
          description: List integration triggers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        integrationType:
                          type: string
                          enum:
                          - github
                          - gitlab
                          - bitbucket
                          - atlassian
                          - linear
                          - slack
                          - sentry
                          - aws
                          - agent
                          - notion
                          - postgres
                          - bigquery
                          - azure
                          - ms-teams
                          - snyk
                          - hubspot
                          - openconnect
                          - tailscale
                        triggers:
                          type: array
                          items:
                            type: object
                            properties:
                              description:
                                type: string
                                maxLength: 4096
                              displayName:
                                type: string
                                maxLength: 500
                              filters:
                                type: object
                                properties:
                                  properties:
                                    type: object
                                    propertyNames:
                                      type: string
                                      minLength: 1
                                      maxLength: 200
                                    additionalProperties:
                                      oneOf:
                                      - type: object
                                        properties:
                                          description:
                                            type: string
                                            maxLength: 2000
                                          type:
                                            type: string
                                            const: boolean
                                          default:
                                            type: boolean
                                        required:
                                        - type
                                        additionalProperties: false
                                      - type: object
                                        properties:
                                          description:
                                            type: string
                                            maxLength: 2000
                                          enum:
                                            type: array
                                            items:
                                              type: string
                                              maxLength: 500
                                            maxItems: 100
                                          type:
                                            type: string
                                            const: string
                                        required:
                                        - type
                                        additionalProperties: false
                                      - type: object
                                        properties:
                                          description:
                                            type: string
                                            maxLength: 2000
                                          items:
                                            type: object
                                            properties:
                                              enum:
                                                type: array
                                                items:
                                                  type: string
                                                  maxLength: 500
                                                maxItems: 100
                                              type:
                                                type: string
                                                const: string
                                            required:
                                            - type
                                            additionalProperties: false
                                          type:
                                            type: string
                                            const: array
                                        required:
                                        - items
                                        - type
                                        additionalProperties: false
                                required:
                                - properties
                                additionalProperties: false
                              hasFilterOptions:
                                type: boolean
                              name:
                                type: string
                                minLength: 1
                                maxLength: 500
                            required:
                            - description
                            - displayName
                            - hasFilterOptions
                            - name
                            additionalProperties: false
                          maxItems: 100
                      required:
                      - integrationType
                      - triggers
                      additionalProperties: false
                    maxItems: 100
                  nextCursor:
                    type:
