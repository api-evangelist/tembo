openapi: 3.2.0
info:
  title: Tembo MCP Connections API
  version: 1.0.0
  description: 'Operations tagged MCP Connections across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: MCP Connections
paths:
  /v1/mcp-connections:
    get:
      operationId: listMcpConnections
      summary: List MCP connections
      description: List MCP connections for the current organization with cursor pagination and optional search by name or URL. Command arguments, headers, and environment configuration are omitted.
      tags:
      - MCP Connections
      security:
      - apiKey: []
      responses:
        '200':
          description: List MCP connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        connectedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        serverUrl:
                          type:
                          - string
                          - 'null'
                        type:
                          type: string
                          enum:
                          - remote
                          - stdio
                        visibility:
                          type: string
                          enum:
                          - shared
                          - personal
                      required:
                      - connectedAt
                      - id
                      - name
                      - serverUrl
                      - type
                      - visibility
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: MCP connection management is not permitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: MCP connection not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: MCP connection conflict or unsupported action
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: MCP connection operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: The remote MCP server operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: connected
        schema:
          type: boolean
      - in: query
        name: cursor
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
