          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: mergedAfter
        schema:
          type: string
          format: date-time
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      - in: query
        name: sortBy
        schema:
          type: string
          enum:
