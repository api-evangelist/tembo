openapi: 3.2.0
info:
  title: Tembo Pull requests API
  version: 1.0.0
  description: 'Operations tagged Pull requests across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Pull requests
paths:
