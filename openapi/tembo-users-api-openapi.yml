openapi: 3.2.0
info:
  title: Tembo Users API
  version: 1.0.0
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Users
paths:
  /v1/users/me:
    get:
      operationId: retrieveCurrentUser
      summary: Retrieve the current user
      description: Retrieve the authenticated user.
      tags:
      - Users
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                  email:
                    type:
                    - string
                    - 'null'
                  emailVerified:
                    type: boolean
                  id:
                    type: string
                    minLength: 1
                    maxLength: 255
                  image:
                    type:
                    - string
                    - 'null'
                  name:
                    type:
                    - string
                    - 'null'
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - createdAt
                - email
                - emailVerified
                - id
                - image
                - name
                - updatedAt
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: User or connected account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: User operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/users/{userId}:
    get:
      operationId: retrieveUser
      summary: Retrieve a user
      description: Retrieve a user profile visible to the caller.
      tags:
      - Users
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve a user
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                  email:
                    type:
                    - string
                    - 'null'
                  emailVerified:
                    type: boolean
                  id:
                    type: string
                    minLength: 1
                    maxLength: 255
                  image:
                    type:
                    - string
                    - 'null'
                  name:
                    type:
                    - string
                    - 'null'
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - createdAt
                - email
                - emailVerified
                - id
                - image
                - name
                - updatedAt
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: User or connected account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: User operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: userId
        schema:
          type: string
          minLength: 1
          maxLength: 255
        required: true
    delete:
      operationId: deleteUser
      summary: Delete a user
      description: Queue permanent deletion of your user account.
      tags:
      - Users
      security:
      - apiKey: []
      responses:
        '200':
          description: Delete a user
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletionJobId:
                    type: string
                    minLength: 1
                    maxLength: 255
                  deletionQueued:
                    type: boolean
                    const: true
                  id:
                    type: string
                    minLength: 1
                    maxLength: 255
                required:
                - deletionJobId
                - deletionQueued
                - id
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: User or connected account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: User operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: userId
        schema:
          type: string
          minLength: 1
          maxLength: 255
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deletionQuestionnaire:
                  type: object
                  properties:
                    reasons:
                      type: array
                      items:
                        type: string
                        minLength: 1
                        maxLength: 255
                      maxItems: 20
                    otherReason:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    submittedAt:
                      type: string
                      format: date-time
                  required:
                  - reasons
                  - submittedAt
                  additionalProperties: false
              additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/users/{userId}/connected-accounts:
    get:
      operationId: listUserConnectedAccounts
      summary: List user connected accounts
      description: List the user identity-provider accounts without returning credentials.
      tags:
      - Users
      security:
      - apiKey: []
      responses:
        '200':
          description: List user connected accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId:
                          type: string
                        createdAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        id:
                          type: string
                          minLength: 1
                          maxLength: 255
                        providerId:
                          type: string
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        email:
                          type:
                          - string
                          - 'null'
                          format: email
                        scopes:
                          type: array
                          items:
                            type: string
                        username:
                          type:
                          - string
                          - 'null'
                      required:
                      - accountId
                      - createdAt
                      - id
                      - providerId
                      - updatedAt
                      - email
                      - scopes
                      - username
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    maxLength: 255
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: User or connected account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: User operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: userId
        schema:
          type: string
          minLength: 1
          maxLength: 255
        required: true
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/users/{userId}/connected-accounts/{connectedAccountId}:
    get:
      operationId: retrieveUserConnectedAccount
      summary: Retrieve a user connected account
      description: Retrieve one identity-provider account without returning credentials.
      tags:
      - Users
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve a user connected account
