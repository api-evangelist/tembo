              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: userId
        schema:
          type: string
          minLength: 1
          maxLength: 255
        required: true
      - in: path
        name: connectedAccountId
        schema:
          type: string
          minLength: 1
          maxLength: 255
        required: true
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/users/{userId}/settings:
    get:
      operationId: retrieveUserSettings
      summary: Retrieve user settings
