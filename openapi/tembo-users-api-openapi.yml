                type: object
                properties:
                  autoRestartVm:
                    type: boolean
                  defaultProjectId:
                    type:
                    - string
                    - 'null'
                  gpgKey:
                    type: string
                  includeTemboCommitAttribution:
                    type: boolean
                  desktopNotificationsEnabled:
                    type: boolean
                  desktopNotificationPreferences:
