                    - string
                    - 'null'
                    format: email
                  scopes:
                    type: array
                    items:
                      type: string
                  username:
                    type:
                    - string
                    - 'null'
                required:
                - accountId
                - createdAt
                - id
                - providerId
                - updatedAt
                - email
                - scopes
                - username
                additionalProperties: false
        '400':
