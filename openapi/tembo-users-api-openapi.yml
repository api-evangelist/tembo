                      pullRequestOpened:
                        type: boolean
                      pullRequestReviewRequested:
                        type: boolean
                    additionalProperties: false
                  appearancePreferences:
                    type: object
                    properties:
                      appTheme:
                        type: string
                        enum:
                        - light
                        - dark
                        - system
                      accentTheme:
                        type: object
                        properties:
                          themeId:
                            type: string
                          customSurface:
                            type:
                            - string
                            - 'null'
                          customAccent:
                            type:
                            - string
                            - 'null'
                          customIntensity:
                            type: number
                          systemLight:
                            type: string
                          systemDark:
                            type: string
                        additionalProperties: false
                    additionalProperties: false
                  appSidebarPreferences:
                    type: object
                    properties:
                      open:
                        type: boolean
                      sessionOwnerScope:
                        type: string
                        enum:
                        - mine
                        - team
                      sessionSortBy:
                        type: string
                        enum:
                        - createdAt
                        - updatedAt
                      sessionOrganization:
                        type: string
                        enum:
                        - list
                        - project
                      showArchivedSessions:
                        type: boolean
                      width:
                        type: number
                      rightSidebar:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            open:
                              type: boolean
                            width:
                              type: string
                          additionalProperties: false
                    additionalProperties: false
                  diffPreferences:
                    type: object
                    properties:
                      style:
                        type: string
                        enum:
                        - unified
                        - split
                      indicators:
                        type: string
                        enum:
                        - classic
                        - bars
                        - none
                      overflow:
                        type: string
                        enum:
                        - scroll
                        - wrap
                      showLineNumbers:
                        type: boolean
                      expandUnchanged:
                        type: boolean
                      showFileTree:
                        type: boolean
                      fileTreePosition:
                        type: string
                        enum:
                        - left
                        - right
                      fileTreeView:
                        type: string
                        enum:
                        - list
                        - tree
                      lightTheme:
                        type: string
                      darkTheme:
                        type: string
                    additionalProperties: false
                  dashboardPreferences:
                    type: object
                    properties:
                      taskFilters:
                        type: object
                        properties:
                          statusFilter:
                            type: array
                            items:
                              type: string
                          sortBy:
                            type: string
                            enum:
                            - createdAt
                            - updatedAt
                          searchQuery:
                            type: string
                          integrationType:
                            type: array
                            items:
                              type: string
                          externalId:
                            type: string
                          projectFilter:
                            type: array
                            items:
                              type: string
                          authorFilter:
                            type: array
                            items:
                              type: string
                          prStatusFilter:
                            type: array
                            items:
                              type: string
                          automationFilter:
                            type: array
                            items:
                              type: string
                        additionalProperties: false
                    additionalProperties: false
                  composerPreferences:
                    type: object
                    properties:
                      lastSelectedRepositories:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            type:
                              type: string
                          required:
                          - id
                          additionalProperties: false
                    additionalProperties: false
                  reviewPreferences:
                    type: object
                    properties:
                      fileSortMode:
                        type: string
                        enum:
                        - tree
                        - path-asc
                        - path-desc
                        - largest
                        - smallest
                      excludedFilePatterns:
                        type: array
                        items:
                          type: string
                      sections:
                        type: object
                        additionalProperties:
                          type: boolean
                      hideBotComments:
                        type: boolean
                      layout:
                        type: object
                        properties:
                          focusChatHeight:
                            type: number
                          activeTab:
                            type: string
                          activeViewMode:
                            type: string
                          focusChatOpen:
                            type: boolean
                          focusMode:
                            type: boolean
                          leftDesktopSidebarOpen:
                            type: boolean
                          leftDesktopSidebarWidth:
                            type: number
                          rightDesktopSidebarOpen:
                            type: boolean
                          rightDesktopSidebarWidth:
                            type: number
                        additionalProperties: false
                    additionalProperties: false
                  diffLightTheme:
                    type: string
                  diffDarkTheme:
                    type: string
                  defaultAgent:
                    type: string
                    pattern: ^[^:]+:[^:]+(?::[^:]+)?$
                  followUpBehavior:
                    type: string
                    enum:
                    - queue
                    - steer
                  customSystemPrompt:
                    type: string
                    maxLength: 4096
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
