                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt:
                          type: string
                          format: date-time
                        id:
                          type: string
                          minLength: 1
                          maxLength: 255
                        role:
                          type: string
                          enum:
                          - org:admin
                          - org:member
                        updatedAt:
                          type: string
                          format: date-time
                        userId:
                          type:
                          - string
                          - 'null'
                        emailAddress:
                          type: string
                          format: email
                        firstName:
                          type:
                          - string
                          - 'null'
                        imageUrl:
                          type:
                          - string
                          - 'null'
                          format: uri
                        lastName:
                          type:
                          - string
                          - 'null'
                        status:
                          type: string
                          enum:
                          - active
                          - pending
                      required:
                      - createdAt
                      - id
                      - role
                      - updatedAt
                      - userId
                      - emailAddress
                      - firstName
                      - imageUrl
                      - lastName
                      - status
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - nextCursor
                additionalProperties: false
