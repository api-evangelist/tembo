          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
