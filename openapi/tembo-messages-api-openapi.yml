openapi: 3.2.0
info:
  title: Tembo Messages API
  version: 1.0.0
  description: 'Operations tagged Messages across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Messages
paths:
  /v1/messages/live:
    post:
      operationId: messageLiveTicket
      summary: Authorize live message changes
      description: Issue a 30-second, session-bound WebSocket ticket.
      tags:
      - Messages
      security:
      - apiKey: []
      responses:
        '200':
          description: Authorize live message changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required:
                - ticket
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Message or session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Message operation conflicts with its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Message operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: object
                  properties:
                    sessionId:
                      type: string
                      format: uuid
                  required:
                  - sessionId
                  additionalProperties: false
              required:
              - scope
              additionalProperties: false
    get:
      operationId: messageLive
      summary: Live persisted message changes
      tags:
      - Messages
      responses:
        '101':
          description: Authorized native WebSocket
        '401':
          description: Invalid or expired live ticket
        '404':
          description: Session not found
      parameters:
      - in: query
        name: ticket
        schema:
          type: string
          minLength: 1
        required: true
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/messages:
    get:
      operationId: listMessages
      summary: List messages
      description: List organization messages with optional session and thread filters.
      tags:
      - Messages
      security:
      - apiKey: []
      responses:
        '200':
          description: List messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        artifactId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        content:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        createdBy:
                          type:
                          - string
                          - 'null'
                        externalAvatarUrl:
                          type:
                          - string
                          - 'null'
                        externalUrl:
                          type:
                          - string
                          - 'null'
                        id:
                          type: string
                          format: uuid
                        parentMessageId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        pullRequestId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        role:
                          type: string
                          enum:
                          - user
                          - assistant
                          - system
                        sessionId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        type:
                          type: string
                        updatedAt:
                          type: string
                          format: date-time
                        richContent:
                          oneOf:
                          - $ref: '#/components/schemas/TipTapDocument'
                          - type: 'null'
                          description: Rich-text representation of the message, including formatting and mentions. The content field contains its text representation.
                        slashCommand:
                          type:
                          - object
                          - 'null'
                          properties:
                            command:
                              type: string
                              minLength: 1
                              maxLength: 200
                            arguments:
                              type: string
                              maxLength: 100000
                          required:
                          - command
                          additionalProperties: false
                        source:
                          type:
                          - string
                          - 'null'
                          maxLength: 100
                      required:
                      - artifactId
                      - content
                      - createdAt
                      - createdBy
                      - externalAvatarUrl
                      - externalUrl
                      - id
                      - parentMessageId
                      - pullRequestId
                      - role
                      - sessionId
                      - type
                      - updatedAt
                      - richContent
                      - slashCommand
                      - source
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Message or session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Message operation conflicts with its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Message operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: sessionId
        schema:
          type: string
          format: uuid
      - in: query
        name: threadId
        schema:
          type: string
          format: uuid
    post:
      operationId: createMessage
      summary: Create a message
      description: Create a user message for a session and submit it to the session agent.
      tags:
      - Messages
      security:
      - apiKey: []
      responses:
        '201':
          description: Create a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotPath:
                    type:
                    - object
                    - 'null'
                    properties:
                      activeProviderTurnId:
                        type:
                        - string
                        - 'null'
                      mode:
                        type: string
                        enum:
                        - started
                        - steered
                        - queued
                      providerSessionId:
                        type:
                        - string
                        - 'null'
                      queuedTurnId:
                        type:
                        - string
                        - 'null'
                      transport:
                        type: string
                    additionalProperties: false
                  job:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: string
                        format: uuid
                      task:
                        type: string
                    required:
                    - id
                    - task
                    additionalProperties: false
                  message:
                    type: object
                    properties:
                      artifactId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      content:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      createdBy:
                        type:
                        - string
                        - 'null'
                      externalAvatarUrl:
                        type:
                        - string
                        - 'null'
                      externalUrl:
                        type:
                        - string
                        - 'null'
                      id:
                        type: string
                        format: uuid
                      parentMessageId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      pullRequestId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                        - system
                      sessionId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      type:
                        type: string
                      updatedAt:
                        type: string
                        format: date-time
                      richContent:
                        oneOf:
                        - $ref: '#/components/schemas/TipTapDocument'
                        - type: 'null'
                        description: Rich-text representation of the message, including formatting and mentions. The content field contains its text representation.
                      slashCommand:
                        type:
                        - object
                        - 'null'
                        properties:
                          command:
                            type: string
                            minLength: 1
                            maxLength: 200
                          arguments:
                            type: string
                            maxLength: 100000
                        required:
                        - command
                        additionalProperties: false
                      source:
                        type:
                        - string
                        - 'null'
                        maxLength: 100
                      isQueued:
                        type: boolean
                    required:
                    - artifactId
                    - content
                    - createdAt
                    - createdBy
                    - externalAvatarUrl
                    - externalUrl
                    - id
                    - parentMessageId
                    - pullRequestId
                    - role
                    - sessionId
                    - type
                    - updatedAt
                    - richContent
                    - slashCommand
                    - source
                    - isQueued
                    additionalProperties: false
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                    required:
                    - id
                    - title
                    additionalProperties: false
                required:
                - hotPath
                - job
                - message
                - session
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Creating a message requires credentials associated with a user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Message or session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Message operation conflicts with its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Message operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                artifactId:
                  type: string
                  format: uuid
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000000
                mcpServers:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                  maxItems: 100
                pullRequestId:
                  type: string
                  format: uuid
                sessionId:
                  type: string
                  format: uuid
                agentOptions:
                  $ref: '#/components/schemas/AgentOptionsInput'
                deliveryMode:
                  type: string
                  enum:
                  - queue
                  - steer
                richContent:
                  $ref: '#/components/schemas/TipTapDocument'
                  description: Optional rich-text representation of the message. Provide the required text content separately.
                slashCommand:
                  type: object
                  properties:
                    command:
                      type: string
                      minLength: 1
                      maxLength: 200
                    arguments:
                      type: string
                      maxLength: 100000
                  required:
                  - command
                  additionalProperties: false
              required:
              - content
              - sessionId
              additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/messages/{messageId}:
    get:
      operationId: retrieveMessage
      summary: Retrieve a message
      description: Retrieve an organization message by ID.
      tags:
      - Messages
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifactId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  content:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  createdBy:
                    type:
                    - string
                    - 'null'
                  externalAvatarUrl:
                    type:
                    - string
                    - 'null'
                  externalUrl:
                    type:
                    - string
                    - 'null'
                  id:
                    type: string
                    format: uuid
                  parentMessageId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  pullRequestId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  role:
                    type: string
                    enum:
                    - user
                    - assistant
                    - system
                  sessionId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  type:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
                  richContent:
                    oneOf:
                    - $ref: '#/components/schemas/TipTapDocument'
                    - type: 'null'
                    description: Rich-text representation of the message, including formatting and mentions. The content field contains its text representation.
                  slashCommand:
                    type:
                    - object
                    - 'null'
                    properties:
                      command:
                        type: string
                        minLength: 1
                        maxLength: 200
                      arguments:
                        type: string
                        maxLength: 100000
                    required:
                    - command
                    additionalProperties: false
                  source:
                    type:
                    - string
                    - 'null'
                    maxLength: 100
                required:
                - artifactId
                - content
                - createdAt
                - createdBy
                - externalAvatarUrl
                - externalUrl
                - id
                - parentMessageId
                - pullRequestId
                - role
                - sessionId
                - type
                - updatedAt
                - richContent
                - slashCommand
                - source
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Message or session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Message operation conflicts with its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Message operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: messageId
        schema:
          type: string
          format: uuid
        required: true
    patch:
      operationId: updateMessage
      summary: Update a message
      description: Update message content before its queued processing has started.
      tags:
      - Messages
      security:
      - apiKey: []
      responses:
        '200':
          description: Update a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifactId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  content:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  createdBy:
                    type:
                    - string
                    - 'null'
                  externalAvatarUrl:
                    type:
                    - string
                    - 'null'
                  externalUrl:
                    type:
                    - string
                    - 'null'
                  id:
                    type: string
                    format: uuid
                  parentMessageId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  pullRequestId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  role:
                    type: string
                    enum:
                    - user
                    - assistant
                    - system
                  sessionId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  type:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
                  richContent:
                    oneOf:
                    - $ref: '#/components/schemas/TipTapDocument'
                    - type: 'null'
                    description: Rich-text representation of the message, including formatting and mentions. The content field contains its text representation.
                  slashCommand:
                    type:
                    - object
                    - 'null'
                    properties:
                      command:
                        type: string
                        minLength: 1
                        maxLength: 200
                      arguments:
                        type: string
                        maxLength: 100000
                    required:
                    - command
                    additionalProperties: false
                  source:
                    type:
                    - string
                    - 'null'
                    maxLength: 100
                required:
                - artifactId
                - content
                - createdAt
                - createdBy
                - externalAvatarUrl
                - externalUrl
                - id
                - parentMessageId
                - pullRequestId
                - role
                - sessionId
                - type
                - updatedAt
                - richContent
                - slashCommand
                - source
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Message or session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Message operation conflicts with its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Message operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: messageId
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000000
                richContent:
                  oneOf:
                  - $ref: '#/components/schemas/TipTapDocument'
                  - type: 'null'
              additionalProperties: false
    delete:
      operationId: deleteMessage
      summary: Delete a message
      description: Delete a message and cancel its queued jobs, runtime turns, and active sandbox sessions.
      tags:
      - Messages
      security:
      - apiKey: []
      responses:
        '200':
          description: Delete a message
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelledJobsCount:
                    type: integer
                    minimum: 0
                  cancelledSessionsCount:
                    type: integer
                    minimum: 0
                  deleted:
                    type: boolean
                    const: true
                  deletedJobsCount:
                    type: number
                    const: 0
                  id:
                    type: string
                    format: uuid
                required:
                - cancelledJobsCount
                - cancelledSessionsCount
                - deleted
                - deletedJobsCount
                - id
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Message or session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Message operation conflicts with its current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Message operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: messageId
        schema:
          type: string
          format: uuid
        required: true
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
components:
  schemas:
    AgentOptionsInput:
      anyOf:
      - type: object
        properties:
          reasoningLevel:
            type: string
            minLength: 1
            maxLength: 100
          mode:
            type: string
            enum:
            - normal
            - planning
          speed:
            type: string
            enum:
            - normal
            - fast
            - ultrafast
          goal:
            type: object
            properties:
              enabled:
                type: boolean
              objective:
                type: string
                maxLength: 100000
            additionalProperties: false
        additionalProperties: true
      - $ref: '#/components/schemas/RuntimeAgentOptions'
      description: Execution settings for the selected agent runtime, including provider-specific options.
    CustomDocument:
      type: object
      additionalProperties: {}
      description: Rich-text content with custom document properties and node attributes.
    TipTapLinkMark:
      type: object
      properties:
        type:
          type: string
          const: link
        attrs:
          type: object
          properties:
            href:
              type:
              - string
              - 'null'
            target:
              type:
              - string
              - 'null'
            rel:
              type:
              - string
              - 'null'
            class:
              type:
              - string
              - 'null'
            title:
              type:
              - string
              - 'null'
          additionalProperties: {}
      required:
      - type
      additionalProperties: {}
    TipTapMark:
      type: object
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 100
          not:
            enum:
            - link
        attrs:
          $ref: '#/components/schemas/TipTapExtensionAttributes'
      required:
      - type
      additionalProperties: {}
    TipTapExtensionAttributes:
      type: object
      additionalProperties: {}
    TipTapMentionAttributes:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        mentionSuggestionChar:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          properties:
            integrationType:
              type: string
            codeRepositoryId:
              type: string
            isHeader:
              type: boolean
            argumentHint:
              type: string
            commandName:
              type: string
            source:
              type: string
          additionalProperties: {}
      additionalProperties: {}
    TipTapDocument:
      anyOf:
      - $ref: '#/components/schemas/TipTapNode'
      - $ref: '#/components/schemas/CustomDocument'
      description: Rich-text document containing text, formatting, images, and mentions. A document typically has a "doc" root with nested content nodes.
      example:
        type: doc
        content:
        - type: paragraph
          content:
          - type: text
            text: Hello
    TipTapContentNode:
      type: object
      properties:
        text:
          type: string
          maxLength: 1000000
        marks:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/TipTapLinkMark'
            - $ref: '#/components/schemas/TipTapMark'
          maxItems: 1000
        type:
          type: string
          minLength: 1
          maxLength: 100
          not:
            enum:
            - image
            - mention
            - heading
            - orderedList
            - taskItem
            - codeBlock
        attrs:
          $ref: '#/components/schemas/TipTapExtensionAttributes'
        content:
          type: array
          items:
            $ref: '#/components/schemas/TipTapNode'
          maxItems: 10000
      additionalProperties: {}
    RuntimeAgentOptions:
      type: object
      additionalProperties: {}
      description: Runtime-specific execution settings and provider extensions.
    TipTapImageAttributes:
      type: object
      properties:
        src:
          type:
          - string
          - 'null'
        alt:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        width:
          type:
          - string
          - 'null'
        data-uploading:
          type:
          - string
          - 'null'
        data-placeholder-id:
          type:
          - string
          - 'null'
        upload-progress:
          type:
          - string
          - 'null'
      additionalProperties: {}
    TipTapNode:
      anyOf:
