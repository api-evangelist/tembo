                  - yellow
                  - green
                  - teal
                  - blue
                  - purple
                  - pink
                icon:
                  type: string
                  enum:
                  - folder
                  - code
                  - terminal
                  - book
                  - brain
                  - bug
                  - building
                  - cloud
                  - globe
                  - idea
                  - tools
                  - magic
                  - processor
                  - sandbox
                  - server
                  - tasks
                  - tactics
                  - images
                  - database
                  - api
                  - mobile
                  - package
