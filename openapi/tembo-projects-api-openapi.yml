openapi: 3.2.0
info:
  title: Tembo Projects API
  version: 1.0.0
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Projects
paths:
  /v1/projects/defaults:
    put:
      operationId: updateProjectDefaults
      summary: Update project defaults
      description: Choose the default project and sandbox size for the organization.
      tags:
      - Projects
      security:
      - apiKey: []
      responses:
        '200':
          description: Update project defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    maxLength: 255
                  sandboxSize:
                    type: string
                    enum:
                    - nano
                    - micro
                    - small
                    - medium
                    - large
                    - xl
                    - xxl
                    - ultra
                required:
                - projectId
                - sandboxSize
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Project resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Project resource conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Project operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 255
                sandboxSize:
                  type: string
                  enum:
                  - nano
                  - micro
                  - small
                  - medium
                  - large
                  - xl
                  - xxl
                  - ultra
              required:
              - projectId
              - sandboxSize
              additionalProperties: false
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      description: List projects in the authenticated organization.
      tags:
      - Projects
      security:
      - apiKey: []
      responses:
        '200':
          description: List projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasBuiltSnapshot:
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt:
                          type: string
                          format: date-time
                        description:
                          type:
                          - string
                          - 'null'
                        id:
                          type: string
                          minLength: 1
                          maxLength: 255
                        includeDeps:
                          type: boolean
                          default: true
                        includeSkills:
                          type: boolean
                          default: true
                        name:
                          type: string
                        setupScript:
                          type:
                          - string
                          - 'null'
                        updatedAt:
                          type: string
                          format: date-time
                        activeSnapshots:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 255
                              size:
                                type: string
                                enum:
                                - nano
                                - micro
                                - small
                                - medium
                                - large
                                - xl
                                - xxl
                                - ultra
                              builtAt:
                                type: string
                                format: date-time
                            required:
                            - id
                            - size
                            - builtAt
                            additionalProperties: false
                        agentInstructions:
                          type:
                          - string
                          - 'null'
                          maxLength: 20000
                        codeRepositoryIds:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                            minLength: 1
                            maxLength: 255
                        color:
                          type: string
                          enum:
                          - neutral
                          - red
                          - orange
                          - yellow
                          - green
                          - teal
                          - blue
                          - purple
                          - pink
                        defaultForSizes:
                          type: array
                          items:
                            type: string
                            enum:
                            - nano
                            - micro
                            - small
                            - medium
                            - large
                            - xl
                            - xxl
                            - ultra
                        icon:
                          type: string
                          enum:
                          - folder
                          - code
                          - terminal
                          - book
                          - brain
                          - bug
                          - building
                          - cloud
                          - globe
                          - idea
                          - tools
                          - magic
                          - processor
                          - sandbox
                          - server
                          - tasks
                          - tactics
                          - images
                          - database
                          - api
                          - mobile
                          - package
                        onboardingDefault:
                          type: boolean
                          description: True for the project created during onboarding until it is first edited
                        sizes:
                          type: array
                          items:
                            type: string
                            enum:
                            - nano
                            - micro
                            - medium
                            - large
                            - xl
                            - xxl
                            - ultra
                        warmPoolEnabled:
                          type: boolean
                      required:
                      - createdAt
                      - description
                      - id
                      - includeDeps
                      - includeSkills
                      - name
                      - setupScript
                      - updatedAt
                      - activeSnapshots
                      - agentInstructions
                      - codeRepositoryIds
                      - color
                      - defaultForSizes
                      - icon
                      - onboardingDefault
                      - sizes
                      - warmPoolEnabled
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    minLength: 1
                    maxLength: 255
                required:
                - hasBuiltSnapshot
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Project resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Project resource conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Project operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: defaultOnly
        schema:
          type: string
          const: 'true'
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 120
