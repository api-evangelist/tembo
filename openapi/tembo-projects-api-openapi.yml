                    - includeSkills
                    - name
                    - setupScript
                    - updatedAt
                    - activeSnapshots
                    - agentInstructions
                    - codeRepositoryIds
                    - color
                    - defaultForSizes
                    - icon
                    - onboardingDefault
                    - sizes
                    - warmPoolEnabled
                    additionalProperties: false
                required:
