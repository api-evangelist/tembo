openapi: 3.2.0
info:
  title: Tembo Sessions API
  version: 1.0.0
  description: 'Operations tagged Sessions across 2 of this provider''s published API definitions: tembo-openapi-original.json, tembo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.tembo.io/
  description: Tembo API
tags:
- name: Sessions
paths:
  /v1/sessions/live:
    post:
      operationId: sessionLiveTicket
      summary: Authorize live session changes
      description: Issue a 30-second, session-bound WebSocket ticket.
      tags:
      - Sessions
      security:
      - apiKey: []
      responses:
        '200':
          description: Authorize live session changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required:
                - ticket
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: The session is private
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller is not permitted to perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Session resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Session operation conflicts with existing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Session operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Session runtime or provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: object
                  properties:
                    sessionId:
                      type: string
                      format: uuid
                  required:
                  - sessionId
                  additionalProperties: false
              required:
              - scope
              additionalProperties: false
    get:
      operationId: sessionLive
      summary: Live session changes
      tags:
      - Sessions
      responses:
        '101':
          description: Authorized native WebSocket
        '401':
          description: Invalid or expired live ticket
        '404':
          description: Session not found
      parameters:
      - in: query
        name: ticket
        schema:
          type: string
          minLength: 1
        required: true
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/sessions/sources:
    get:
      operationId: listSessionSources
      summary: List session sources
      description: List session sources in the authenticated organization.
      tags:
      - Sessions
      security:
      - apiKey: []
      responses:
        '200':
          description: List session sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt:
                          type: string
                          format: date-time
                        enabledAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        externalId:
                          type:
                          - string
                          - 'null'
                        externalUrl:
                          type:
                          - string
                          - 'null'
                        id:
                          type: string
                          format: uuid
                        lastScannedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        lastSeenAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        name:
                          type: string
                        type:
                          type: string
                        updatedAt:
                          type: string
                          format: date-time
                        integration:
                          type:
                          - object
                          - 'null'
                          properties:
                            type:
                              type: string
                          required:
                          - type
                        repositories:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              owner:
                                type:
                                - string
                                - 'null'
                              baseBranch:
                                type:
                                - string
                                - 'null'
                              provider:
                                type: string
                            required:
                            - id
                            - name
                            - owner
                            - baseBranch
                            - provider
                            additionalProperties: false
                      required:
                      - createdAt
                      - enabledAt
                      - externalId
                      - externalUrl
                      - id
                      - lastScannedAt
                      - lastSeenAt
                      - name
                      - type
                      - updatedAt
                      - integration
                      - repositories
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  totalCount:
                    type: integer
                    minimum: 0
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: The session is private
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller is not permitted to perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Session resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Session operation conflicts with existing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Session operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Session runtime or provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: enabled
        schema:
          type: boolean
      - in: query
        name: includeTotal
        schema:
          type: boolean
          default: false
      - in: query
        name: integrationId
        schema:
          type: string
          format: uuid
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: sessionId
        schema:
          type: string
          format: uuid
      - in: query
        name: types
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/sessions/sources/{sourceId}:
    get:
      operationId: retrieveSessionSource
      summary: Retrieve a session source
      description: Retrieve one session source.
      tags:
      - Sessions
      security:
      - apiKey: []
      responses:
        '200':
          description: Retrieve a session source
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                  enabledAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  externalId:
                    type:
                    - string
                    - 'null'
                  externalUrl:
                    type:
                    - string
                    - 'null'
                  id:
                    type: string
                    format: uuid
                  lastScannedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  lastSeenAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  name:
                    type: string
                  type:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
                  integration:
                    type:
                    - object
                    - 'null'
                    properties:
                      type:
                        type: string
                    required:
                    - type
                  repositories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        owner:
                          type:
                          - string
                          - 'null'
                        baseBranch:
                          type:
                          - string
                          - 'null'
                        provider:
                          type: string
                      required:
                      - id
                      - name
                      - owner
                      - baseBranch
                      - provider
                      additionalProperties: false
                required:
                - createdAt
                - enabledAt
                - externalId
                - externalUrl
                - id
                - lastScannedAt
                - lastSeenAt
                - name
                - type
                - updatedAt
                - integration
                - repositories
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: The session is private
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller is not permitted to perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Session resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Session operation conflicts with existing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Session operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Session runtime or provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: path
        name: sourceId
        schema:
          type: string
          format: uuid
        required: true
    servers:
    - url: https://api.tembo.io/
      description: Tembo API
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List sessions
      description: List sessions you have permission to access, with cursor pagination.
      tags:
      - Sessions
      security:
      - apiKey: []
      responses:
        '200':
          description: List sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        agent:
                          type:
                          - string
                          - 'null'
                        agentId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        createdAt:
                          type: string
                          format: date-time
                        externalId:
                          type:
                          - string
                          - 'null'
                        id:
                          type: string
                          format: uuid
                        kind:
                          type: string
                        lastQueuedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        lastSeenAt:
                          type: string
                          format: date-time
                        level:
                          type: integer
                        projectId:
                          type:
                          - string
                          - 'null'
                        title:
                          type: string
                        updatedAt:
                          type: string
                          format: date-time
                        visibility:
                          type: string
                          enum:
                          - public
                          - private
                          default: public
                        artifacts:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              pullRequests:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    agent:
                                      type:
                                      - string
                                      - 'null'
                                    codeRepository:
                                      type:
                                      - object
                                      - 'null'
                                      properties:
                                        id:
                                          type: string
                                          format: uuid
                                        provider:
                                          type: string
                                      required:
                                      - id
                                      - provider
                                      additionalProperties: false
                                    id:
                                      type: string
                                      format: uuid
                                    isDraft:
                                      type: boolean
                                    status:
                                      type: string
                                      enum:
                                      - open
                                      - merged
                                      - closed
                                    url:
                                      type: string
                                      format: uri
                                  required:
                                  - agent
                                  - codeRepository
                                  - id
                                  - isDraft
                                  - status
                                  - url
                                  additionalProperties: false
                              type:
                                type: string
                                enum:
                                - PullRequest
                                - ToolCall
                                - Plan
                                - Response
                                - File
                                - Service
                                - Source
                            required:
                            - id
                            - pullRequests
                            - type
                            additionalProperties: false
                        diffSummary:
                          type:
                          - object
                          - 'null'
                          properties:
                            additions:
                              type: integer
                            deletions:
                              type: integer
                          required:
                          - additions
                          - deletions
                          additionalProperties: false
                        isPinned:
                          type: boolean
                        project:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            icon:
                              type: string
                              enum:
                              - folder
                              - code
                              - terminal
                              - book
                              - brain
                              - bug
                              - building
                              - cloud
                              - globe
                              - idea
                              - tools
                              - magic
                              - processor
                              - sandbox
                              - server
                              - tasks
                              - tactics
                              - images
                              - database
                              - api
                              - mobile
                              - package
                            color:
                              type: string
                              enum:
                              - neutral
                              - red
                              - orange
                              - yellow
                              - green
                              - teal
                              - blue
                              - purple
                              - pink
                          required:
                          - id
                          - name
                          - icon
                          - color
                          additionalProperties: false
                        sessionSource:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            type:
                              type: string
                            repositories:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                required:
                                - id
                                additionalProperties: false
                          required:
                          - id
                          - name
                          - type
                          - repositories
                          additionalProperties: false
                        sourcePullRequest:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                              format: uuid
                            url:
                              type: string
                              format: uri
                            title:
                              type:
                              - string
                              - 'null'
                            status:
                              type: string
                              enum:
                              - open
                              - merged
                              - closed
                            isDraft:
                              type: boolean
                          required:
                          - id
                          - url
                          - title
                          - status
                          - isDraft
                          additionalProperties: false
                        state:
                          type: object
                          properties:
                            current:
                              type: string
                              enum:
                              - inProgress
                              - queued
                              - completed
                              - failed
                              - cancelled
                            isQueued:
                              type: boolean
                            isCancelled:
                              type: boolean
                            isCompleted:
                              type: boolean
                            isFailed:
                              type: boolean
                            inProgress:
                              type: boolean
                          required:
                          - isQueued
                          - isCancelled
                          - isCompleted
                          - isFailed
                          - inProgress
                          additionalProperties: false
                      required:
                      - agent
                      - agentId
                      - createdAt
                      - externalId
                      - id
                      - kind
                      - lastQueuedAt
                      - lastSeenAt
                      - level
                      - projectId
                      - title
                      - updatedAt
                      - visibility
                      - artifacts
                      - diffSummary
                      - isPinned
                      - project
                      - sessionSource
                      - sourcePullRequest
                      - state
                      additionalProperties: false
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  totalCount:
                    type: integer
                    minimum: 0
                required:
                - items
                - nextCursor
                additionalProperties: false
        '400':
          description: Invalid request or missing required organization or user information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: The session is private
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '403':
          description: The caller is not permitted to perform this operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '404':
          description: Session resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '409':
          description: Session operation conflicts with existing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '500':
          description: Session operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '502':
          description: Session runtime or provider operation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      parameters:
      - in: query
        name: agentId
        schema:
          type: string
          format: uuid
      - in: query
        name: createdBy
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: createdAfter
        schema:
          type: string
          format: date-time
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 500
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: excludePinned
        schema:
          type: boolean
      - in: query
        name: externalIds
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: hasProject
        schema:
          type: boolean
      - in: query
        name: includeArchived
        schema:
          type: boolean
          default: true
      - in: query
        name: includeTotal
        schema:
          type: boolean
          default: false
      - in: query
        name: participant
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: pendingReviewerKeys
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: projectIds
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: pullRequestStatuses
        schema:
          type: array
          items:
            type: string
            enum:
            - open
            - merged
            - closed
          default: []
      - in: query
        name: repositoryIds
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: sortBy
        schema:
          type: string
          enum:
          - lastQueuedAt
          - createdAt
          - updatedAt
          default: lastQueuedAt
      - in: query
        name: sourceIds
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: sourceTypes
        schema:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      - in: query
        name: state
        schema:
          type: string
          enum:
          - all
          - active
          - archived
          default: all
    post:
      operationId: createSession
      summary: Create a session
      description: Create a session for a task. Provide the initial prompt in description and optionally configure its repositories and agent.
      tags:
      - Sessions
      security:
      - apiKey: []
      responses:
        '201':
          description: Create a session
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type:
                    - string
                    - 'null'
                  agentId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  artifactType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - PullRequest
                    - ToolCall
                    - Plan
                    - Response
                    - File
                    - Service
                    - Source
                    - null
                  baseBranch:
                    type:
                    - string
                    - 'null'
                  branchName:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    format: date-time
                  externalId:
                    type:
                    - string
                    - 'null'
                  externalUrl:
                    type:
                    - string
                    - 'null'
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                  lastQueuedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  lastSeenAt:
                    type: string
                    format: date-time
                  level:
                    type: integer
                  mode:
                    type: string
                    enum:
                    - normal
                    - planning
                    default: normal
                  projectId:
                    type:
                    - string
                    - 'null'
                  sandboxSize:
                    type:
                    - string
                    - 'null'
                    enum:
                    - nano
                    - micro
                    - small
                    - medium
                    - large
                    - xl
                    - xxl
                    - ultra
                    - null
                  sessionType:
                    type: string
                    enum:
                    - Chat
                    - Terminal
                    default: Chat
                  targetBranch:
                    type:
                    - string
                    - 'null'
                  title:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
                  visibility:
                    type: string
                    enum:
                    - public
                    - private
                    default: public
                  artifacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                          - PullRequest
                          - ToolCall
                          - Plan
                          - Response
                          - File
                          - Service
                          - Source
                        createdAt:
                          type: string
